{%- assign link = site.data.signup-genius | where: "short-path", page.short-path | first -%}
<!DOCTYPE html>
<html lang="en-US">
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ link.url }}">
  <script>location.replace("{{ link.url }}")</script>
  <meta http-equiv="refresh" content="0; url={{ link.url }}">
  <meta name="robots" content="noindex">
  <h1>Redirecting&hellip;</h1>
  <a href="{{ link.url }}">Click here if you are not redirected.</a>
</html>
